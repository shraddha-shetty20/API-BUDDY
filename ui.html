<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>API Buddy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
        }

        h1 {
            color: white;
            margin-top: 0;
        }

        h2 {
            color: white;
            font-size: 16px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 20px;
        }

        .section {
            margin-top: 20px;
        }

        .request-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        select,
        input,
        textarea {
            background: #252526;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 12px;
            outline: none;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: #007acc;
        }

        select {
            width: 130px;
        }

        #url {
            flex: 1;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            font-family: Consolas, monospace;
        }

        button {
            background: #007acc;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0098ff;
        }

        #clear {
            background: #444444;
        }

        #clear:hover {
            background: #555555;
        }

        #runSaved {
            background: #16825d;
        }

        #runSaved:hover {
            background: #1a9b6e;
        }

        #saveApi {
            background: #8b5cf6;
        }

        #saveApi:hover {
            background: #a678ff;
        }

        #editSaved {
            background: #d69d00;
        }

        #editSaved:hover {
            background: #e6ad10;
        }

        #deleteSaved {
            background: #c73e3e;
        }

        #deleteSaved:hover {
            background: #e05050;
        }

        .saved-row {
            display: flex;
            gap: 10px;
        }

        #savedApis {
            flex: 1;
            width: auto;
        }

        .response-info {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            padding: 10px;
            background: #252526;
            border: 1px solid #444;
            border-radius: 5px;
        }

        .status {
            font-weight: bold;
        }

        .success {
            color: #4ec9b0;
        }

        .error {
            color: #f48771;
        }

        .response {
            min-height: 180px;
            background: #252526;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 15px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .response-body {
            min-height: 250px;
        }

    </style>

</head>


<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <h1>🚀 API Buddy</h1>

    <div class="subtitle">
        Test REST APIs directly inside VS Code
    </div>


    <!-- ========================= -->
    <!-- SAVED APIs -->
    <!-- ========================= -->

    <div class="section">

        <h2>⭐ Saved APIs</h2>

        <div class="saved-row">

            <select id="savedApis">

                <option value="">
                    Select a saved API
                </option>

            </select>

            <button id="runSaved">
                ▶ Run
            </button>

            <button id="editSaved">
                ✏ Edit
            </button>

            <button id="deleteSaved">
                🗑 Delete
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- REQUEST -->
    <!-- ========================= -->

    <div class="section">

        <div class="request-row">

            <select id="method">

                <option value="GET">
                    GET
                </option>

                <option value="POST">
                    POST
                </option>

                <option value="PUT">
                    PUT
                </option>

                <option value="PATCH">
                    PATCH
                </option>

                <option value="DELETE">
                    DELETE
                </option>

            </select>


            <input
                id="url"
                type="text"
                placeholder="Enter API URL"
            >


            <button id="send">
                Send
            </button>


            <button id="saveApi">
                ⭐ Save API
            </button>


            <button id="clear">
                Clear
            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- HEADERS -->
    <!-- ========================= -->

    <div class="section">

        <h2>Headers</h2>

        <textarea
            id="headers"
            placeholder='{
  "Authorization": "Bearer token",
  "Content-Type": "application/json"
}'
        ></textarea>

    </div>


    <!-- ========================= -->
    <!-- REQUEST BODY -->
    <!-- ========================= -->

    <div
        class="section"
        id="bodySection"
    >

        <h2>Request Body</h2>

        <textarea
            id="body"
            placeholder='{
  "name": "Shraddha",
  "role": "Developer"
}'
        ></textarea>

    </div>


    <!-- ========================= -->
    <!-- RESPONSE -->
    <!-- ========================= -->

    <div class="section">

        <h2>Response</h2>

        <div class="response-info">

            <div
                id="status"
                class="status"
            >
                Status: —
            </div>

            <div id="responseTime">
                Response Time: —
            </div>

        </div>


        <h2>
            Response Headers
        </h2>

        <div
            id="responseHeaders"
            class="response"
        >
            Response headers will appear here...
        </div>


        <h2>
            Response Body
        </h2>

        <div
            id="response"
            class="response response-body"
        >
            Response will appear here...
        </div>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        const vscode =
            acquireVsCodeApi();


        // =========================
        // ELEMENTS
        // =========================

        const methodSelect =
            document.getElementById(
                'method'
            );

        const bodySection =
            document.getElementById(
                'bodySection'
            );

        const savedApisSelect =
            document.getElementById(
                'savedApis'
            );

        const runSavedButton =
            document.getElementById(
                'runSaved'
            );

        const editSavedButton =
            document.getElementById(
                'editSaved'
            );

        const deleteSavedButton =
            document.getElementById(
                'deleteSaved'
            );

        const saveApiButton =
            document.getElementById(
                'saveApi'
            );


        // =========================
        // REQUEST BODY VISIBILITY
        // =========================

        function updateBodyVisibility() {

            const method =
                methodSelect.value;

            if (
                ['POST', 'PUT', 'PATCH']
                    .includes(method)
            ) {

                bodySection.style.display =
                    'block';

            } else {

                bodySection.style.display =
                    'none';

            }

        }


        updateBodyVisibility();


        methodSelect.addEventListener(
            'change',
            updateBodyVisibility
        );


        // =========================
        // SEND REQUEST
        // =========================

        document
            .getElementById('send')
            .addEventListener(
                'click',
                () => {

                    const method =
                        methodSelect.value;


                    const url =
                        document
                            .getElementById('url')
                            .value
                            .trim();


                    const headers =
                        document
                            .getElementById('headers')
                            .value
                            .trim();


                    const body =
                        document
                            .getElementById('body')
                            .value
                            .trim();


                    if (!url) {

                        document
                            .getElementById('status')
                            .textContent =
                            'Error: Enter API URL';

                        document
                            .getElementById('status')
                            .className =
                            'status error';

                        return;

                    }


                    document
                        .getElementById('status')
                        .textContent =
                        'Sending request...';

                    document
                        .getElementById('status')
                        .className =
                        'status';


                    document
                        .getElementById('responseTime')
                        .textContent =
                        'Response Time: —';


                    document
                        .getElementById('responseHeaders')
                        .textContent =
                        'Loading...';


                    document
                        .getElementById('response')
                        .textContent =
                        'Loading...';


                    vscode.postMessage({

                        command:
                            'sendRequest',

                        method:
                            method,

                        url:
                            url,

                        headers:
                            headers,

                        body:
                            body

                    });

                }
            );


        // =========================
        // SAVE API FROM UI
        // =========================

        saveApiButton.addEventListener(
            'click',
            () => {

                const method =
                    methodSelect.value;


                const url =
                    document
                        .getElementById('url')
                        .value
                        .trim();


                if (!url) {

                    document
                        .getElementById('status')
                        .textContent =
                        'Error: Enter API URL first';

                    document
                        .getElementById('status')
                        .className =
                        'status error';

                    return;

                }


                vscode.postMessage({

                    command:
                        'saveApiFromUI',

                    url:
                        url,

                    method:
                        method

                });

            }
        );


        // =========================
        // CLEAR
        // =========================

        document
            .getElementById('clear')
            .addEventListener(
                'click',
                () => {

                    document
                        .getElementById('url')
                        .value = '';


                    document
                        .getElementById('headers')
                        .value = '';


                    document
                        .getElementById('body')
                        .value = '';


                    document
                        .getElementById('status')
                        .textContent =
                        'Status: —';


                    document
                        .getElementById('status')
                        .className =
                        'status';


                    document
                        .getElementById('responseTime')
                        .textContent =
                        'Response Time: —';


                    document
                        .getElementById('responseHeaders')
                        .textContent =
                        'Response headers will appear here...';


                    document
                        .getElementById('response')
                        .textContent =
                        'Response will appear here...';

                }
            );


        // =========================
        // EDIT SAVED API
        // =========================

        editSavedButton.addEventListener(
            'click',
            () => {

                const selectedIndex =
                    savedApisSelect.value;

                if (selectedIndex === '') {

                    document
                        .getElementById('status')
                        .textContent =
                        'Please select a saved API';

                    document
                        .getElementById('status')
                        .className =
                        'status error';

                    return;
                }

                vscode.postMessage({

                    command:
                        'editSavedApiFromUI',

                    index:
                        Number(selectedIndex)

                });

            }
        );


        // =========================
        // DELETE SAVED API
        // =========================

        deleteSavedButton.addEventListener(
            'click',
            () => {

                const selectedIndex =
                    savedApisSelect.value;

                if (selectedIndex === '') {

                    document
                        .getElementById('status')
                        .textContent =
                        'Please select a saved API';

                    document
                        .getElementById('status')
                        .className =
                        'status error';

                    return;
                }

                vscode.postMessage({

                    command:
                        'deleteSavedApiFromUI',

                    index:
                        Number(selectedIndex)

                });

            }
        );


        // =========================
        // GET SAVED APIs
        // =========================

        vscode.postMessage({

            command:
                'getSavedApis'

        });


        // =========================
        // RUN SAVED API
        // =========================

        runSavedButton.addEventListener(
            'click',
            () => {

                const selectedIndex =
                    savedApisSelect.value;


                if (
                    selectedIndex === ''
                ) {

                    document
                        .getElementById('status')
                        .textContent =
                        'Please select a saved API';

                    document
                        .getElementById('status')
                        .className =
                        'status error';

                    return;

                }


                vscode.postMessage({

                    command:
                        'runSavedApi',

                    index:
                        Number(selectedIndex)

                });

            }
        );


        // =========================
        // RECEIVE MESSAGES
        // =========================

        window.addEventListener(
            'message',
            event => {

                const message =
                    event.data;


                // -------------------------
                // SAVED APIs
                // -------------------------

                if (
                    message.command ===
                    'savedApis'
                ) {

                    savedApisSelect.innerHTML =
                        '';


                    const defaultOption =
                        document.createElement(
                            'option'
                        );


                    defaultOption.value =
                        '';


                    defaultOption.textContent =
                        'Select a saved API';


                    savedApisSelect.appendChild(
                        defaultOption
                    );


                    message.apis.forEach(
                        (api, index) => {

                            const option =
                                document.createElement(
                                    'option'
                                );


                            option.value =
                                index;


                            option.textContent =
                                `${api.name} — ${api.method}`;


                            savedApisSelect
                                .appendChild(
                                    option
                                );

                        }
                    );

                }


                // -------------------------
                // API SAVED
                // -------------------------

                if (
                    message.command ===
                    'apiSaved'
                ) {

                    document
                        .getElementById('status')
                        .textContent =
                        `API "${message.name}" saved successfully!`;


                    document
                        .getElementById('status')
                        .className =
                        'status success';

                }


                // -------------------------
                // RESPONSE
                // -------------------------

                if (
                    message.command ===
                    'response'
                ) {

                    document
                        .getElementById('status')
                        .textContent =
                        `Status: ${message.status}`;


                    document
                        .getElementById('status')
                        .className =
                        'status success';


                    document
                        .getElementById('responseTime')
                        .textContent =
                        `Response Time: ${message.responseTime} ms`;


                    document
                        .getElementById('responseHeaders')
                        .textContent =
                        message.headers ||
                        'No response headers';


                    document
                        .getElementById('response')
                        .textContent =
                        message.data;

                }


                // -------------------------
                // ERROR
                // -------------------------

                if (
                    message.command ===
                    'error'
                ) {

                    document
                        .getElementById('status')
                        .textContent =
                        'Request Failed';


                    document
                        .getElementById('status')
                        .className =
                        'status error';


                    document
                        .getElementById('responseTime')
                        .textContent =
                        'Response Time: —';


                    document
                        .getElementById('responseHeaders')
                        .textContent =
                        'No response headers';


                    document
                        .getElementById('response')
                        .textContent =
                        message.message;

                }


                // -------------------------
                // LOAD SAVED API
                // -------------------------

                if (
                    message.command ===
                    'loadSavedApi'
                ) {

                    methodSelect.value =
                        message.api.method;


                    document
                        .getElementById('url')
                        .value =
                        message.api.url;


                    updateBodyVisibility();

                }

            }
        );

    </script>

</body>

</html>
